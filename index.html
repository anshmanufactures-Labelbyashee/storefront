<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>labelbyashee | Ethnic & Festive Wear</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .logo-link {
            text-decoration: none;
            cursor: pointer;
        }
        .logo-image {
            width: 100px; /* Adjust size as needed */
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #511832;
            margin-bottom: 20px;
        }
        h1 {
            color: #511832;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }
        .button:hover {
            opacity: 0.9;
        }
        .icon {
            margin-right: 10px;
            font-size: 18px;
        }
        .meesho { background-color: #cf235f; }
        .maps { background-color: #3b82f6; }
        .whatsapp { background-color: #10b981; }
        .instagram { background-color: #be1259; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Clickable Logo -->
        <a href="https://www.instagram.com/labelbyashee/" target="_blank" class="logo-link">
            <!-- Ensure your logo image is saved as 'labelbyashee_logo.png' in the same folder -->
            <img src="labelbyashee_logo.png" alt="labelbyashee Logo" class="logo-image">
        </a>

        <h1>labelbyashee</h1>
        <p class="subtitle">Premium Kurtis, Co-Ord Sets & Ethnic Wear</p>

        <a href="#" class="button meesho">
            <span class="icon">🛍️</span> Shop Catalog on Meesho
        </a>
        <a href="#" class="button maps">
            <span class="icon">📍</span> Visit Store on Google Maps
        </a>
        <a href="#" class="button whatsapp">
            <span class="icon">💬</span> Chat on WhatsApp
        </a>
        <a href="https://www.instagram.com/labelbyashee/" target="_blank" class="button instagram">
            <span class="icon">📷</span> Follow on Instagram (@labelbyashee)
        </a>
    </div>

</body>
</html>
