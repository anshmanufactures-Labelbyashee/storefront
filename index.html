<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Ethnic Collections | Direct Storefront</title>
    <style>
        :root {
            --primary-color: #511832;
            --accent-color: #e03268;
            --bg-color: #FAF6F3;
            --text-color: #2D2D2D;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            width: 100%;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 16px auto;
        }

        h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(224, 50, 104, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            background-color: #c92857;
        }

        .categories {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .cat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="avatar">MEESHO</div>
            <h1>Labelbyashee</h1>
            <p class="subtitle">Premium Kurtis, Co-Ord Sets & Designer Wear</p>

            <a href="https://www.meesho.com/ANSHMANUFACTURERS?ms=2" target="_blank" class="cta-btn">
                <span>Shop Full Catalog on Meesho</span>
                ➔ <p>Contact: 8867642517<br>Instagram: Labelbyashee</p>
            </a>
        </div>

        <div class="categories">
            <div class="cat-card">✨ Festive Kurtis</div>
            <div class="cat-card">💃 Trendy Co-Ords</div>
            <div class="cat-card">🌸 Daily Cotton Wear</div>
            <div class="cat-card">🚚 Free Delivery</div>
        </div>
    </div>

    <footer>
        © Storefront Directory • Powered by Direct Links
    </footer>

</body>
</html>
